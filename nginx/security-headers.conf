# Mismas cabeceras que public/.htaccess (el despliegue con Apache). `always` para
# que salgan también en los 404 y 304. Se incluye en CADA location: nginx no hereda
# los add_header de un nivel superior si el location define alguno propio.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
