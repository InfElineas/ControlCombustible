# Equivalente a public/.htaccess para el despliegue en contenedor.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Comprobación de salud (no pasa por el fallback a index.html).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Los bundles llevan hash en el nombre: cacheables para siempre. Si falta uno,
    # 404 honesto: caer en index.html devolvía HTML con 200 bajo la URL de un .js y
    # una CDN lo guardaba, dejando la app en blanco sin error.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html nunca se cachea: apunta a los bundles con hash, y uno viejo pediría
    # un bundle que ya no existe.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # El .apk no lleva hash: si se cachea, tras subir una versión nueva la gente
    # seguiría descargando la vieja. Con este tipo MIME Android ofrece instalarlo al
    # abrirlo; como octet-stream (lo que nginx usa por omisión) se queda en descargas
    # sin que el sistema sepa qué hacer con él. `types` aquí solo afecta a este location.
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Android App Link: /.well-known/assetlinks.json (ver docs/migracion-is/ANDROID-APP-LINK.md).
    location /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta que no sea un archivo cae en index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }
}
