apply plugin: 'com.android.application'

// Credenciales de firma. Viven en android/firma.properties, que esta fuera del
// control de versiones: la clave privada y sus contrasenas no se versionan nunca.
// Si el archivo no esta, la compilacion de release sale sin firmar y el propio
// Gradle avisa, en lugar de entregar un archivo que no se puede instalar.
def archivoFirma = rootProject.file('firma.properties')
def propsFirma = new Properties()
if (archivoFirma.exists()) {
    archivoFirma.withInputStream { propsFirma.load(it) }
} else {
    logger.lifecycle('AVISO: no hay android/firma.properties — la version de release saldra SIN FIRMAR. Ver LEEME-firma.md')
}
def hayFirma = archivoFirma.exists() && propsFirma['storeFile']

android {
    namespace "com.mercadoelineas.combustible"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.mercadoelineas.combustible"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.6"
        // Dominio https de la aplicación web, para el Android App Link con el que
        // Google devuelve el control a la app (ver docs/migracion-is/ANDROID-APP-LINK.md).
        // Se pasa con -PAPP_LINK_HOST=app.ejemplo.com o en android/gradle.properties.
        // El valor por defecto es un dominio .invalid (nunca existe): una compilación
        // sin configurar no intercepta enlaces de nadie, simplemente no recibe la vuelta.
        manifestPlaceholders = [appLinkHost: (project.findProperty('APP_LINK_HOST') ?: 'sin-configurar.invalid')]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hayFirma) {
                storeFile file(propsFirma['storeFile'])
                storePassword propsFirma['storePassword']
                keyAlias propsFirma['keyAlias']
                keyPassword propsFirma['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hayFirma) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
